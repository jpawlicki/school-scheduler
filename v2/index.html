        });

        // Callbacks for Undo/Redo/Load
        const onNewBlock = (id) => {
           console.log('UI: New block detected:', id);
           const existingRow = blockTableBody.querySelector(`tr[data-id="${id}"]`);
           if (!existingRow) {
             const row = createBlockRow(id);
             if (row) blockTableBody.appendChild(row);
           }
           if (linkerDiv.style?.display !== 'none') renderLinker();
           if (schedulerDiv.style?.display !== 'none') renderBlocks();
        };
        
        const onNewResource = (id) => {
           console.log('UI: New resource detected:', id);
           // Check if row already exists to avoid duplicates
           const existingRow = resourceTableBody.querySelector(`tr[data-id="${id}"]`);
           if (!existingRow) {
             const row = createResourceRow(id);
             if (row) resourceTableBody.appendChild(row);
           }
           if (linkerDiv.style.display !== 'none') renderLinker();
        };

        // --- View Switching Logic ---
        
        const views = {
          scheduler: schedulerDiv,
          blocks: blockEditorDiv,
          resources: resourceEditorDiv,
          linker: linkerDiv,
          settings: settingsEditorDiv
        };

        const viewBtns = {
          scheduler: document.getElementById('viewSchedulerBtn'),
          blocks: document.getElementById('viewBlocksBtn'),
          resources: document.getElementById('viewResourcesBtn'),
          linker: document.getElementById('viewLinkerBtn'),
          settings: document.getElementById('viewSettingsBtn')
        };

        const scheduleTools = document.getElementById('schedulewindowtools');

        function switchView(viewName) {
          // 1. Hide all views
          Object.values(views).forEach(el => el.style.display = 'none');
          
          // 2. Show selected view
          if (views[viewName]) {
            views[viewName].style.display = 'flex'; // Changed to Flex for scheduler
            if (viewName !== 'scheduler') {
                views[viewName].style.display = 'block'; // Block for others
            }
            
            // Special initialization for views
            if (viewName === 'linker') {
              renderLinker();
            }
            if (viewName === 'scheduler') {
              // Wait for display change to take effect before measuring width
              requestAnimationFrame(() => {
                renderGrid();
                renderBlocks();
              });
            }
          }

          // 3. Update buttons
          Object.values(viewBtns).forEach(btn => btn.classList.remove('active-view-btn'));
          if (viewBtns[viewName]) {
            viewBtns[viewName].classList.add('active-view-btn');
          }

          // 4. Toggle Scheduler specific tools
          if (viewName === 'scheduler') {
            scheduleTools.style.display = 'flex';
          } else {
            scheduleTools.style.display = 'none';
          }
        }

        // Add Listeners to View Buttons
        Object.keys(viewBtns).forEach(key => {
          viewBtns[key].addEventListener('click', () => switchView(key));
        });

        // Initialize default view
        switchView('scheduler');


        // --- Basic Tools ---
        
        helpBtn.addEventListener('click', () => {
          window.open('help.html', '_blank');
        });

        saveBtn.addEventListener('click', () => {
          const jsonStr = JSON.stringify(data, null, 2);
          const blob = new Blob([jsonStr], {type: 'application/json'});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'schedule.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });

        loadBtn.addEventListener('click', () => {
          fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const loadedData = JSON.parse(event.target.result);
              // Basic validation could go here
              if (!loadedData.blocks || !loadedData.resources) {
                alert("Invalid schedule file format.");
                return;
              }
              // We must manually clear the list before loading new data to remove old DOM/listeners
              resourceTableBody.innerHTML = '';
              blockTableBody.innerHTML = '';
              loadData(loadedData, onNewBlock, onNewResource);
              updateSettingsView(); // Refresh settings UI
              if (linkerDiv.style?.display !== 'none') renderLinker();
              if (schedulerDiv.style?.display !== 'none') {
                renderGrid(); // Refresh grid
                renderBlocks();
              }
            } catch (err) {
              console.error(err);
              alert("Failed to parse JSON file.");
            }
            // Reset input so same file can be selected again if needed
            fileInput.value = ''; 
          };
          reader.readAsText(file);
        });

        undoBtn.addEventListener('click', () => {
          undo(onNewBlock, onNewResource);
          updateSettingsView(); // Refresh settings UI on undo
          if (linkerDiv.style.display !== 'none') renderLinker();
          if (schedulerDiv.style.display !== 'none') {
            renderGrid(); // Refresh grid
            renderBlocks();
          }
        });

        redoBtn.addEventListener('click', () => {
          redo(onNewBlock, onNewResource);
          updateSettingsView(); // Refresh settings UI on redo
          if (linkerDiv.style.display !== 'none') renderLinker();
          if (schedulerDiv.style.display !== 'none') {
             renderGrid(); // Refresh grid
             renderBlocks();
          }
        });
        
        // --- Optimization Tools ---
        
        shuffleBtn.addEventListener('click', () => {
            shuffle();
            if (views.scheduler.style.display !== 'none') renderBlocks();
        });
        
        improveBtn.addEventListener('click', () => {
            improve();
            if (views.scheduler.style.display !== 'none') renderBlocks();
        });

        resectionBtn.addEventListener('click', () => {
            resection();
            if (views.scheduler.style.display !== 'none') renderBlocks();
        });
        
        searchBtn.addEventListener('click', () => {
            search();
            if (views.scheduler.style.display !== 'none') renderBlocks();
        });
      });
    </script>
  </body>
</html>
